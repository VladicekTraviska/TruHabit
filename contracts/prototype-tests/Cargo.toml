[package]
name = "truhabit-prototype-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
truhabit-prototype = { path = "../prototype/programs/truhabit-prototype", features = ["no-entrypoint"] }
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }
litesvm = "=0.16.0"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-instruction = "~3.4.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-message = "4.4.1"
solana-clock = "~3.1.1"
solana-sdk-ids = "3.1.0"
spl-token-interface = "2.0.0"
solana-program-pack = "3.1.0"
solana-program-option = "3.1.0"
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
serde_json = "1.0"
